<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <defs>
    <!-- 1. Apple Squircle Base Gradient (Consistent with bin0sky.tech suite) -->
    <linearGradient id="squircleBg" x1="100" y1="60" x2="924" y2="964" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="45%" stop-color="#1E1B4B"/>
      <stop offset="75%" stop-color="#31104B"/>
      <stop offset="100%" stop-color="#090A14"/>
    </linearGradient>

    <!-- Top Specular Ambient Glow -->
    <radialGradient id="topGlow" cx="512" cy="140" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090A14" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Border Rim Gradient -->
    <linearGradient id="rimGrad" x1="120" y1="80" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.45"/>
    </linearGradient>

    <!-- 4K Cinema Glass Frame Gradient -->
    <linearGradient id="frameBorder" x1="180" y1="240" x2="844" y2="784" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#E879F9" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="frameFill" x1="512" y1="250" x2="512" y2="774" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0F24" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#150D2A" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Aurora Sky & Horizon Glow inside Frame -->
    <radialGradient id="auroraSky" cx="512" cy="480" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <!-- Front Hero Mountain Gradient (Cyan -> Indigo -> Rose Aurora) -->
    <linearGradient id="frontPeak" x1="220" y1="400" x2="760" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#818CF8"/>
      <stop offset="80%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <!-- Back Mountain Ridge Gradient -->
    <linearGradient id="backPeak" x1="380" y1="360" x2="820" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Zenith Star Gradient -->
    <linearGradient id="starGrad" x1="600" y1="310" x2="720" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>

    <!-- Clip Path for the Inner 4K Viewport -->
    <clipPath id="screenClip">
      <rect x="184" y="256" width="656" height="464" rx="84"/>
    </clipPath>

    <!-- Drop Shadow for Floating 4K Viewport -->
    <filter id="viewportShadow" x="120" y="200" width="784" height="600" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 1. Main Squircle Base -->
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#squircleBg)"/>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#topGlow)"/>
  <rect x="52" y="52" width="920" height="920" rx="212" stroke="url(#rimGrad)" stroke-width="8"/>

  <!-- 2. Floating 4K Cinema Viewport Frame -->
  <g filter="url(#viewportShadow)">
    <rect x="184" y="256" width="656" height="464" rx="84" fill="url(#frameFill)"/>

    <!-- Clipped Artwork inside the 4K Screen -->
    <g clip-path="url(#screenClip)">
      <!-- Aurora Sky Glow -->
      <circle cx="512" cy="460" r="320" fill="url(#auroraSky)"/>

      <!-- Subtle Aurora Wave Ribbon in Sky -->
      <path
        d="M160 390 C 310 310, 460 440, 620 350 C 720 295, 800 340, 860 320"
        stroke="url(#frameBorder)"
        stroke-width="18"
        stroke-linecap="round"
        opacity="0.35"
      />

      <!-- Distant Mountain Silhouette -->
      <path
        d="M360 730 L610 405 L870 730 Z"
        fill="url(#backPeak)"
      />

      <!-- Primary Iconic Aurora Mountain Peak -->
      <path
        d="M140 730 L416 396 L696 730 Z"
        fill="url(#frontPeak)"
      />

      <!-- Mountain Ridge Specular Highlight -->
      <path
        d="M416 396 L485 730 L140 730 Z"
        fill="#FFFFFF"
        opacity="0.12"
      />

      <!-- Calm Horizon Water Reflection Lines -->
      <rect x="300" y="666" width="424" height="8" rx="4" fill="#FFFFFF" opacity="0.22"/>
      <rect x="364" y="688" width="296" height="6" rx="3" fill="#38BDF8" opacity="0.28"/>
    </g>

    <!-- Glowing Glass Viewport Border -->
    <rect x="184" y="256" width="656" height="464" rx="84" stroke="url(#frameBorder)" stroke-width="14"/>
    <rect x="196" y="268" width="632" height="440" rx="72" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
  </g>

  <!-- 3. Iconic 4-Point Ambient Star (Top Right of Viewport) -->
  <path
    d="M668 316 L683 361 L728 376 L683 391 L668 436 L653 391 L608 376 L653 361 Z"
    fill="url(#starGrad)"
  />
  <circle cx="668" cy="376" r="6" fill="#FFFFFF"/>

  <!-- 4. Minimalist Ambient Soundwave / Stand Indicator below Screen -->
  <rect x="424" y="776" width="176" height="14" rx="7" fill="url(#frameBorder)" opacity="0.85"/>
  <circle cx="384" cy="783" r="7" fill="#38BDF8" opacity="0.6"/>
  <circle cx="640" cy="783" r="7" fill="#E879F9" opacity="0.6"/>
</svg>
