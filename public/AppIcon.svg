<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep Cosmic Obsidian Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B14"/>
      <stop offset="50%" stop-color="#14182B"/>
      <stop offset="100%" stop-color="#1C1427"/>
    </linearGradient>

    <!-- Vibrant Sunset Aurora Glow -->
    <linearGradient id="aurora" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="40%" stop-color="#F43F5E"/>
      <stop offset="75%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>

    <!-- Secondary Violet Mountain Glow -->
    <linearGradient id="mountainBack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Sun Glow -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Sleek 4K Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean Background without any outer white strokes -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>

  <!-- Ambient Light Atmosphere -->
  <circle cx="512" cy="450" r="320" fill="url(#aurora)" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Golden Sun -->
  <circle cx="512" cy="360" r="110" fill="url(#sunGrad)"/>

  <!-- Back Mountain Silhouette -->
  <path d="M220,680 L440,440 L620,620 L780,470 L900,680 Z" fill="url(#mountainBack)" opacity="0.85"/>

  <!-- Front Scenic Aurora Mountain -->
  <path d="M120,680 L380,390 L580,590 L740,410 L940,680 Z" fill="url(#aurora)"/>

  <!-- Ultra Clean Minimalist 4K Typography at bottom -->
  <text x="512" y="830" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="110" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="8">4K</text>
  
  <text x="512" y="890" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="30" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="10">AMBIENT</text>
</svg>
