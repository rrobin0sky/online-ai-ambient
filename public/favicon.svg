<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favBg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <linearGradient id="favFrame" x1="10" y1="14" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>

    <linearGradient id="favPeak" x1="14" y1="24" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <clipPath id="favClip">
      <rect x="10" y="15" width="44" height="31" rx="6"/>
    </clipPath>
  </defs>

  <!-- Full-bleed Rounded Base for crisp 16px/32px Tab Icon -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- 4K Viewport Screen -->
  <rect x="10" y="15" width="44" height="31" rx="6" fill="#090A16"/>

  <g clip-path="url(#favClip)">
    <!-- Back Mountain -->
    <path d="M24 47 L40 26 L55 47 Z" fill="#6366F1" opacity="0.75"/>
    <!-- Front Aurora Peak -->
    <path d="M9 47 L27 24 L45 47 Z" fill="url(#favPeak)"/>
  </g>

  <!-- Glowing Screen Border -->
  <rect x="10" y="15" width="44" height="31" rx="6" stroke="url(#favFrame)" stroke-width="2.5"/>

  <!-- 4-Point Ambient Star -->
  <path d="M44 19 L45.3 23.2 L49.5 24.5 L45.3 25.8 L44 30 L42.7 25.8 L38.5 24.5 L42.7 23.2 Z" fill="#FFFFFF"/>

  <!-- Minimalist Base Bar -->
  <rect x="25" y="51" width="14" height="2.5" rx="1.25" fill="url(#favFrame)"/>
</svg>
